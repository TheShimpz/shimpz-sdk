[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "shimpz"
version = "0.3.0"
description = "Python SDK for authoring Shimpz Assistants"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
  { name = "Shimpz Inc" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://shimpz.com"
Repository = "https://github.com/TheShimpz/shimpz-sdk"
Issues = "https://github.com/TheShimpz/shimpz-sdk/issues"

[dependency-groups]
dev = [
  "maturin>=1.10,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "shimpz._native"
bindings = "pyo3"
strip = true
