[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "shimpz"
version = "0.1.0"
description = "Python SDK for authoring Shimpz Assistants"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
  { name = "The Shimpz Authors" },
]
dependencies = []

[dependency-groups]
dev = [
  "maturin>=1.10,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "shimpz._native"
bindings = "pyo3"
strip = true
