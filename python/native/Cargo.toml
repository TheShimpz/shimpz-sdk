[package]
name = "shimpz-python"
version = "0.4.1"
description = "Private PyO3 binding for the Shimpz Python SDK"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py314", "extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shimpz-genesis = { path = "../../crates/shimpz-genesis" }

[lints]
workspace = true
