name: Release Genesis

on:
  push:
    tags: ["genesis-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#genesis-v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "shimpz-genesis") | .version')"
          test "${tag_version}" = "${crate_version}"
      - run: cargo test --locked --package shimpz-genesis
      - run: cargo clippy --locked --package shimpz-genesis --all-targets --all-features -- -D warnings
      - run: cargo package --locked --package shimpz-genesis
      - name: Authenticate to crates.io
        id: crates
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish shimpz-genesis
        run: cargo publish --locked --package shimpz-genesis
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
